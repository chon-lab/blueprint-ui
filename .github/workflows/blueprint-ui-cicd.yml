name: Blueprint UI CI/CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: chon-lab/blueprint-ui

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.export-tags.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=blueprint-ui
          cache-to: type=gha,mode=max,scope=blueprint-ui

      - name: Export primary image tag
        id: export-tags
        shell: bash
        run: |
          TAG="$(echo '${{ steps.meta.outputs.tags }}' | head -n 1)"
          echo "image=${TAG}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to server
    runs-on: self-hosted
    needs: build-and-push
    environment: production

    steps:
      - name: Deploy blueprint-ui service
        shell: bash
        run: |
          set -e

          stackName="${{ secrets.DEPLOY_STACK_NAME }}"
          if [ -z "$stackName" ]; then
            stackName="embratur-destinations"
          fi

          serviceName="${stackName}_blueprint-ui"
          imageName="${{ needs.build-and-push.outputs.image }}"

          GHCR_USER="${{ secrets.GHCR_USERNAME || github.actor }}"
          GHCR_PASS="${{ secrets.GHCR_TOKEN || github.token }}"
          echo "$GHCR_PASS" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          docker pull $imageName
          docker service update --image $imageName --update-order stop-first --with-registry-auth $serviceName
